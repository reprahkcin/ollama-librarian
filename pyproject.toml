[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-librarian"
version = "1.0.5"
description = "Local Ollama-powered librarian UI and document RAG indexer"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.2.0",
  "ebooklib>=0.18",
]

[project.scripts]
ollama-librarian = "ollama_librarian.web:main"
ollama-librarian-index = "ollama_librarian.indexer:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ollama_librarian = [
  "VERSION",
  "templates/*.html",
  "assets/**",
]
