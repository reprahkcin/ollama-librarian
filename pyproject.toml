[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-librarian"
version = "0.1.0"
description = "Local Ollama-powered librarian UI and document RAG indexer"
requires-python = ">=3.10"
dependencies = [
  "pypdf",
  "ebooklib",
]

[project.scripts]
ollama-librarian = "ollama_librarian.web:main"
ollama-librarian-index = "ollama_librarian.indexer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
